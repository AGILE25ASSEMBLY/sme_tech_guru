# .streamlit/config.toml

[theme]
primaryColor="#4CAF50"  # A vibrant green (e.g., for buttons, links)
backgroundColor="#FFFFFF" # Pure white background
secondaryBackgroundColor="#F0F2F6" # Light grey for containers/sidebar
textColor="#262730"     # Dark text for readability
font="sans serif"       # Modern sans-serif font

[server]
# Enable CORS if deploying and facing issues, though Streamlit handles most cases
# enableCORS=true
# enableXsrfProtection=true